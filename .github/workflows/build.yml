name: Build

# Every push (any branch) and a manual run: compile the benchmark APK (signed with the debug key, so no
# release key is needed here), run the unit tests, keep the APK for the manager to install on the phone.
# Builders push their branch and read the result here instead of compiling on the shared PC.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          # The runner has 7 GB: one JVM (Kotlin compiled in-process, no separate daemon) at 4 GB.
          # 5 GB plus a Kotlin daemon got the job killed after 6 minutes (run 42368777461).
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" -Pkotlin.compiler.execution.strategy=in-process assembleBenchmark testDebugUnitTest

      - name: Keep the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-benchmark-${{ github.sha }}
          path: app/build/outputs/apk/benchmark/app-benchmark.apk
          retention-days: 7

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7
